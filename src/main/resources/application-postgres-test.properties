# ===================================================================
# Database Connection Settings (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/personal_finance
spring.datasource.username=personal_finance_app_user
spring.datasource.password=FallBread@26
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Ensures Hibernate targets PostgreSQL SQL generation, not H2
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "validate" verifies the database schema matches your Java @Entity classes without dropping anything
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===================================================================
# Flyway Migrations
# ===================================================================
spring.flyway.enabled=true
# Clean disabled prevents catastrophic accidental database drops in test/prod
spring.flyway.clean-disabled=true
